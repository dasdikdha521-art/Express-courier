{% extends "base.html" %}

{% block content %}

<div class="dashboard">

<h1>Welcome Admin 👋</h1>

<div class="dashboard-buttons">

<div class="card">
<h2>📦 Total Couriers</h2>
<p>{{ total }}</p>
</div>

<div class="card">
<h2>🚚 Delivered</h2>
<p>{{ delivered }}</p>
</div>

<div class="card">
<h2>⏳ In Transit</h2>
<p>{{ transit }}</p>
</div>

<div class="card">
<h2>❌ Cancelled</h2>
<p>{{ cancelled }}</p>
</div>

</div>

</div>
    <div class="dashboard-buttons">

        <a href="add_courier" class="btn">Add Courier</a>

        <a href="view_couriers" class="btn">View Couriers</a>

        <a href="search_courier" class="btn">Search Courier</a>

        <a href="update_status" class="btn">Update Status</a>

        <a href="delete_courier" class="btn">Delete Courier</a>

        <a href="reports" class="btn">Reports</a>

    </div>



{% endblock %}
