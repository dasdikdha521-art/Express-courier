{% extends "base.html" %}

{% block content %}

<div class="form-container">

<h2>Track Courier</h2>

<form method="POST">

<input
type="text"
name="tracking_id"
placeholder="Tracking ID"
required>

<button>

Track

</button>

</form>

{% if courier %}

<hr>

<p><b>Tracking ID:</b> {{ courier[0] }}</p>

<p><b>Receiver:</b> {{ courier[5] }}</p>

<p><b>Status:</b> {{ courier[13] }}</p>

<p><b>Expected Delivery:</b> {{ courier[12] }}</p>

{% endif %}

</div>

{% endblock %}
